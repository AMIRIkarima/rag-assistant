[build-system]
# Build backend used by `uv build` (and by pip) to create the wheel and the sdist.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-assistant"
# Single source of truth for the version. Bump it with `uv version --bump <part>`
# (or edit this line), then run `uv build`.
version = "0.1.1"
description = "Retrieval-augmented assistant for scientific papers about gravitational waves."
readme = "README.md"
# Upper bound: onnxruntime (pulled in by chromadb) has no wheels for Python 3.15 yet.
requires-python = ">=3.12,<3.15"
authors = [{ name = "Karima Amiri", email = "karima.amiri@etu.emse.fr" }]
keywords = ["rag", "retrieval", "arxiv", "chromadb", "fastapi", "mistral"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

# Runtime dependencies. The exact resolved versions are pinned in uv.lock,
# which is committed so that every machine installs the same set.
dependencies = [
    "mistralai==3.1.0",           # answer generation (Mistral API client)
    "arxiv",                      # download papers and metadata from arXiv
    "chromadb",                   # persistent vector store
    "fastapi",                    # HTTP API
    "pymupdf",                    # PDF text extraction
    "sentence-transformers",      # local embeddings (BAAI/bge-small-en-v1.5)
    "uvicorn[standard]",          # ASGI server for the API
    "python-dotenv",              # load MISTRAL_API_KEY from a local .env file
]

[project.urls]
Repository = "https://github.com/AMIRIkarima/rag-assistant"

[tool.hatch.build.targets.wheel]
# The code lives in the `src` package (imported as `src.ingest`, `src.api`, ...).
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "eval", "README.md", "pyproject.toml", "uv.lock"]